{% extends "base.html" %}
{% block head_title %}{{ titulo }}{% endblock %}
{% block content %}
  <h1>{{ titulo }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "_campos.html" %}
    <div class="botoes">
      <button type="submit">Salvar cliente</button>
      <a href="{% url 'clientes:lista' %}">Cancelar</a>
    </div>
  </form>
{% endblock %}
