{% extends "base.html" %}
{% block head_title %}Novo usuário{% endblock %}
{% block titulo_tela %}Usuários{% endblock %}
{% block largura %} estreito{% endblock %}
{% block content %}

  <form method="post" novalidate>
    {% csrf_token %}

      <button type="submit">Cadastrar usuário</button>
      <a href="{% url 'usuarios:lista' %}">Cancelar</a>
    </div>
  </form>
{% endblock %}
