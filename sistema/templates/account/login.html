{% extends "base.html" %}
{% block head_title %}Entrar{% endblock %}
{% block content %}
  <h1 class="titulo-caixa">Entrar</h1>
  <p class="nota">Use o e-mail e a senha que o administrador da sua organização cadastrou.</p>
  <form method="post" action="{% url 'account_login' %}" novalidate>
    {% csrf_token %}
    {% include "_campos.html" %}
    {{ redirect_field }}
    <div class="botoes">
      <button type="submit">Entrar</button>
    </div>
  </form>
{% endblock %}
